name: Update Currency & Prices Daily

on:
  schedule:
    - cron: '0 0 * * *'  # Daily at 00:00 UTC (5:30 AM IST)
  workflow_dispatch:  # Manual trigger

jobs:
  update-currency-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          repository: better95159-hub/betterestech-uploads
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Fetch Exchange Rates JSON
        run: |
          echo "Fetching exchange rates..."
          curl -o price-cache/exchange-rates.json "https://betterestech.unaux.com/wp-admin/admin-ajax.php?action=betterestech_get_exchange_rates"
      
      - name: Fetch Product Prices USD JSON
        run: |
          echo "Fetching product prices..."
          curl -o price-cache/product-prices-usd.json "https://betterestech.unaux.com/wp-admin/admin-ajax.php?action=betterestech_get_product_prices"
      
      - name: Verify JSON Files
        run: |
          echo "Verifying exchange-rates.json..."
          if ! jq empty price-cache/exchange-rates.json 2>/dev/null; then
            echo "ERROR: exchange-rates.json is invalid"
            exit 1
          fi
          
          echo "Verifying product-prices-usd.json..."
          if ! jq empty price-cache/product-prices-usd.json 2>/dev/null; then
            echo "ERROR: product-prices-usd.json is invalid"
            exit 1
          fi
          
          echo "✓ Both JSON files are valid"
      
      - name: Commit and Push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add price-cache/exchange-rates.json
          git add price-cache/product-prices-usd.json
          git commit -m "Auto-update currency data - $(date '+%Y-%m-%d %H:%M UTC')" || exit 0
          git push
      
      - name: Wait for GitHub to Process
        run: |
          echo "Waiting 30 seconds for GitHub to process commit..."
          sleep 30
      
      - name: Purge jsDelivr Cache - Exchange Rates
        run: |
          echo "Purging exchange-rates.json from CDN..."
          curl -X POST "https://purge.jsdelivr.net/gh/better95159-hub/betterestech-uploads@main/price-cache/exchange-rates.json"
          sleep 5
      
      - name: Purge jsDelivr Cache - Product Prices
        run: |
          echo "Purging product-prices-usd.json from CDN..."
          curl -X POST "https://purge.jsdelivr.net/gh/better95159-hub/betterestech-uploads@main/price-cache/product-prices-usd.json"
      
      - name: Summary
        run: |
          echo "================================"
          echo "✓ Exchange rates updated"
          echo "✓ Product prices updated"
          echo "✓ CDN cache purged"
          echo "✓ Deployment complete"
          echo "================================"
