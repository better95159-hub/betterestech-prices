name: Update Reviews JSON Daily

on:
  schedule:
    - cron: '0 1 * * *'  # 6:30 AM IST (1 hour after prices)
  workflow_dispatch:  # Manual trigger

jobs:
  update-reviews:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          repository: better95159-hub/betterestech-uploads
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Fetch reviews from WordPress
        run: |
          curl -o reviews.json "https://betterestech.unaux.com/wp-admin/admin-ajax.php?action=generate_reviews_json"
      
      - name: Commit and Push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add reviews.json
          git commit -m "Auto-update reviews - $(date)" || exit 0
          git push
